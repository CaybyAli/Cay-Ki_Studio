<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cay Studio</title>
<link rel="icon" href="/static/app2/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app2/app.css">
<script defer src="/static/app2/app.js"></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="#new">Cay Studio</a>
  <nav class="tabs" aria-label="Bereiche">
    <button data-nav="new">Neu</button>
    <button data-nav="projects">Projekte</button>
    <button data-nav="library">Figuren</button>
  </nav>
  <div class="bar-tools">
    <span class="health" id="health" title="Dienste werden geprüft"></span>
    <button class="icon-button" data-action="theme" aria-label="Hell oder dunkel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button class="icon-button" data-action="settings" aria-label="Einrichtung und System">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>
<main id="main" tabindex="-1"><p class="muted">Studio wird geöffnet …</p></main>
<footer class="footer"><span>Läuft vollständig auf deinem PC.</span><span id="version"></span></footer>
<dialog class="sheet" id="sheet"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
